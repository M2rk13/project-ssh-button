plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.projectsshbutton'
    compileSdk 36

    packaging {
        resources {
            excludes += ['META-INF/versions/**']
        }
    }

    defaultConfig {
        applicationId 'ru.projectsshbutton'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation(group: 'org.bouncycastle', name: 'bcprov' + '-jdk18on', version: '1.80')
}
